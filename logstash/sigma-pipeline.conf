input {
  http {
    port => 5001
    codec => json
  }
}

filter {
  mutate { remove_field => ["host"] }

  # if threat_display exists, copy into threat.name
  if [threat_display] {
    mutate { add_field => { "[threat][name]" => "%{threat_display}" } }
  }

  # Map mapped_technique if exists
  if [mapped_technique] {
    mutate {
      rename => { "mapped_technique" => "[threat][technique][id]" }
      add_field => { "[threat][framework]" => "MITRE ATT&CK" }
    }
  }

  # Ensure id field is properly nested
  mutate {
    rename => { "id" => "[event][id]" }
  }

  # Rename other fields
  mutate {
    rename => {
      "rule_type" => "[rule][type]"
      "signature" => "[rule][signature]"
      "tool"      => "[rule][tool]"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "sigma-logs-%{+YYYY.MM.dd}"
  }

  # Stdout for debugging
  stdout { codec => rubydebug }
}
