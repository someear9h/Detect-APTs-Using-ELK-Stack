input {
  http {
    port => 5001
    codec => json
  }
}

filter {
  mutate {
    copy => { "src_ip"           => "[source][ip]" }
    copy => { "dst_ip"           => "[destination][ip]" }
    copy => { "src_port"         => "[source][port]" }
    copy => { "dst_port"         => "[destination][port]" }
    copy => { "protocol"         => "[network][protocol]" }
    copy => { "application_name" => "[network][application]" }
    copy => { "Activity"         => "[event][activity]" }
    copy => { "DefenderResponse" => "[event][response]" }
    copy => { "Signature"        => "[event][signature]" }
    copy => { "threat"           => "[threat][indicator]" }

    # Now remove the original flat fields
    remove_field => ["host","src_ip","dst_ip","src_port","dst_port","protocol","application_name","Activity","DefenderResponse","Signature","threat"]
  }

  mutate {
    convert => {
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
    }
  }

  # Optional: mark threat events explicitly
  if [event][activity] == "Malicious" or [event][stage] =~ /(Reconnaissance|Lateral Movement)/ {
    mutate { add_field => { "[threat][detected]" => true } }
  } else {
    mutate { add_field => { "[threat][detected]" => false } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "netflow-threat-logs-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}
